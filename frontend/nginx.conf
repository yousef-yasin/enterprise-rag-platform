# Frontend reverse proxy (docs/ARCHITECTURE.md §23.2, §24.2).
# Phase 0 serves a static placeholder; the SSE-aware proxy rules are already in
# place for the streaming endpoints added in Phase 6.

server {
    listen 8080;   # unprivileged nginx (uid 101); compose publishes the host port
    server_name _;

    # Docker's embedded DNS — resolve `api` at request time so nginx starts even
    # before the api container is ready.
    resolver 127.0.0.11 valid=10s ipv6=off;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Streaming endpoints (SSE): no buffering, long read timeout.
    location ~ ^/api/v1/.*stream$ {
        set $upstream_api api:8000;
        proxy_pass http://$upstream_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        chunked_transfer_encoding on;
    }

    location /api/ {
        set $upstream_api api:8000;
        proxy_pass http://$upstream_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health/ {
        set $upstream_api api:8000;
        proxy_pass http://$upstream_api;
        proxy_set_header Host $host;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}
