# Ephemeral infrastructure for integration tests and CI (docs/ARCHITECTURE.md §34).
# No named volumes — data does not survive `down`. Ports on 127.0.0.1.
# Started by `make test-integration`.

name: enterprise-rag-platform-test

services:
  postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag_local_dev
      POSTGRES_DB: rag
    ports:
      - "127.0.0.1:5432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag"]
      interval: 3s
      timeout: 3s
      retries: 30

  qdrant:
    image: qdrant/qdrant:v1.15.4
    environment:
      QDRANT__SERVICE__API_KEY: qdrant_local_dev
      QDRANT__TELEMETRY_DISABLED: "true"
    ports:
      - "127.0.0.1:6333:6333"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333' 2>/dev/null || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7.4-alpine
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory-policy
      - noeviction
      - --requirepass
      - redis_local_dev
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test:
        - CMD-SHELL
        - redis-cli -a redis_local_dev --no-auth-warning ping | grep -q PONG
      interval: 3s
      timeout: 3s
      retries: 30
