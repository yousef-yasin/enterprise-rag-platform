name: Bug report
description: Something doesn't work the way the docs say it should
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you expected vs. what actually happened.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Minimal steps, including relevant config (`APP_PROFILE`, provider settings — redact secrets).
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit / version
      description: Output of `git rev-parse HEAD` or the release tag.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - backend (API/worker)
        - frontend
        - ingestion/retrieval
        - evaluation
        - docker/deployment
        - docs
        - other
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      render: shell
