name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_VERSION: "0.12.9"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - working-directory: backend
        run: uv sync --frozen
      - working-directory: backend
        run: uv run ruff check --output-format=github .
      - working-directory: backend
        run: uv run ruff format --check .

  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - working-directory: backend
        run: uv sync --frozen
      - working-directory: backend
        run: uv run mypy

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - working-directory: backend
        run: uv sync --frozen
      - working-directory: backend
        run: uv run pytest tests/unit --cov=app --cov-report=term-missing

  integration:
    runs-on: ubuntu-latest
    env:
      RAG_INTEGRATION: "1"
      APP_PROFILE: ci
      LLM_PROVIDER: fake
      EMBEDDING_PROVIDER: fake
      RERANKER: none
      POSTGRES_HOST: 127.0.0.1
      QDRANT_URL: http://127.0.0.1:6333
      REDIS_HOST: 127.0.0.1
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: start test infrastructure
        run: docker compose -f compose.test.yml up -d --wait
      - working-directory: backend
        run: uv sync --frozen
      - working-directory: backend
        run: uv run alembic upgrade head
      - working-directory: backend
        run: uv run pytest tests/integration -p no:warnings
      - if: always()
        run: docker compose -f compose.test.yml down -v

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: compose config validates without a .env file
        run: docker compose config --quiet

      - name: Build backend image
        run: docker build -t erp-backend:ci ./backend

      - name: Build frontend image
        run: docker build -t erp-frontend:ci ./frontend

      - name: config-check passes with a valid (ci) configuration
        run: >-
          docker run --rm
          -e APP_PROFILE=ci -e LLM_PROVIDER=fake -e EMBEDDING_PROVIDER=fake
          erp-backend:ci rag config-check

      - name: config-check fails fast when a hosted LLM key is missing
        run: |
          set +e
          output="$(docker run --rm \
            -e APP_PROFILE=local -e LLM_PROVIDER=openai -e LLM_API_KEY= \
            -e EMBEDDING_PROVIDER=fastembed \
            erp-backend:ci rag config-check 2>&1)"
          code=$?
          echo "$output"
          [ "$code" -ne 0 ] || { echo "::error::expected a non-zero exit"; exit 1; }
          echo "$output" | grep -q "LLM_API_KEY" \
            || { echo "::error::expected LLM_API_KEY in the message"; exit 1; }

      - name: fake providers are rejected in a runtime profile
        run: |
          set +e
          docker run --rm \
            -e APP_PROFILE=local -e LLM_PROVIDER=fake -e EMBEDDING_PROVIDER=fake \
            erp-backend:ci rag config-check
          [ $? -ne 0 ] || { echo "::error::fake providers must be rejected when APP_PROFILE=local"; exit 1; }

  e2e-smoke:
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: bring up the full stack (fake providers, production compose)
        env:
          APP_PROFILE: ci
          LLM_PROVIDER: fake
          EMBEDDING_PROVIDER: fake
          RERANKER: none
          AUTH_MODE: multi_user
          BOOTSTRAP_ADMIN_EMAIL: admin@example.com
          BOOTSTRAP_ADMIN_PASSWORD: admin-password-123
          ALLOW_OPEN_REGISTRATION: "true"
        run: docker compose -f docker-compose.yml up -d --build --wait

      - name: golden flow (curl)
        run: bash scripts/e2e_smoke.sh

      - name: golden flow (Playwright UI)
        working-directory: frontend
        env:
          E2E_BASE_URL: http://127.0.0.1:8080
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run e2e

      - if: always()
        run: docker compose logs --no-color > compose-logs.txt || true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: |
            compose-logs.txt
            frontend/playwright-report
          if-no-files-found: ignore
      - if: always()
        run: docker compose down -v

  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}

      - name: pip-audit (backend deps)
        working-directory: backend
        run: uvx pip-audit -r <(uv export --frozen --no-hashes --no-emit-project) || true

      - name: bandit (backend static analysis)
        working-directory: backend
        run: uvx bandit -r app -ll -x app/providers/llm/fake.py

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: npm audit (frontend deps)
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high || true

      - name: gitleaks (secret scan)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: trivy (filesystem vuln + misconfig scan)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: "0"
