name: deploy

# Manual only — deploying to Cloud Run costs real (if small) money and should
# never happen as a side effect of a routine push. See docs/DEPLOYMENT.md.
on:
  workflow_dispatch:
    inputs:
      region:
        description: "Cloud Run region"
        required: true
        default: "us-central1"
      service:
        description: "Cloud Run service name"
        required: true
        default: "erp-api"

permissions:
  contents: read
  id-token: write # required for Workload Identity Federation — no JSON key

env:
  UV_VERSION: "0.12.9"

jobs:
  # Same gates as ci.yml. Deploy only runs if these pass.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { version: "${{ env.UV_VERSION }}", enable-cache: true }
      - working-directory: backend
        run: uv sync --frozen
      - working-directory: backend
        run: uv run ruff check --output-format=github .
      - working-directory: backend
        run: uv run ruff format --check .

  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { version: "${{ env.UV_VERSION }}", enable-cache: true }
      - working-directory: backend
        run: uv sync --frozen
      - working-directory: backend
        run: uv run mypy

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { version: "${{ env.UV_VERSION }}", enable-cache: true }
      - working-directory: backend
        run: uv sync --frozen
      - working-directory: backend
        run: uv run pytest tests/unit --cov=app --cov-report=term-missing

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  deploy:
    needs: [lint, types, unit, frontend]
    runs-on: ubuntu-latest
    environment: production # requires a manual approval gate if configured in repo settings
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      # Workload Identity Federation: exchanges this workflow run's OIDC token
      # for short-lived GCP credentials. No service-account JSON key is ever
      # stored in GitHub. Set up the pool/provider once per
      # https://github.com/google-github-actions/auth#setting-up-workload-identity-federation
      # then set these repo secrets:
      #   GCP_WORKLOAD_IDENTITY_PROVIDER  projects/.../locations/global/workloadIdentityPools/.../providers/...
      #   GCP_SERVICE_ACCOUNT             erp-deployer@PROJECT_ID.iam.gserviceaccount.com
      #   GCP_PROJECT_ID                  your GCP project id
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: configure docker for artifact registry
        run: gcloud auth configure-docker "${{ github.event.inputs.region }}-docker.pkg.dev"

      - name: build and push the Cloud Run image
        working-directory: backend
        run: |
          IMAGE="${{ github.event.inputs.region }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/erp/api:${{ github.sha }}"
          docker build -f Dockerfile.cloudrun -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      # Deploys the image only. Env vars / secrets on the Cloud Run service
      # are managed via `gcloud run services update` separately (see
      # docs/DEPLOYMENT.md) — this workflow intentionally does not touch them,
      # so a deploy never accidentally changes production configuration.
      - name: deploy to Cloud Run
        run: |
          gcloud run deploy "${{ github.event.inputs.service }}" \
            --image="$IMAGE" \
            --region="${{ github.event.inputs.region }}" \
            --platform=managed \
            --quiet
